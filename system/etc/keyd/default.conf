# keyd — mapeo extra para layout latam
#
# Permite escribir < y > aunque el teclado físico no tenga la tecla entre
# Shift izquierdo y Z (teclados ANSI/US con layout latam, donde esos símbolos
# solo existen en esa tecla).
#
#   AltGr + ,   →  <
#   AltGr + .   →  >
#
# Se emite el keycode 102nd (KEY_102ND, la tecla que en latam produce </>) y
# shift+102nd, así el símbolo final lo resuelve el layout latam del servidor
# gráfico. El resto de combinaciones con AltGr (@, |, \, «) quedan intactas.
#
# Instalación: make keyd  (o ./install.sh --only keyd)
# Recarga tras editar: sudo keyd reload

[ids]
*

[altgr]
, = 102nd
. = S-102nd
