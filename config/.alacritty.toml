# =========================
#  Alacritty — config TOML
#  Últ. edición: 2025-08-11
# =========================

[font]
# normal = { family = "Font Awesome 6 Free", style = "Regular" }
size = 12

[cursor]
# subrayado como querías, con parpadeo suave
style = { shape = "Underline", blinking = "On" }
thickness = 0.20

[window]
dynamic_padding = true
dynamic_title = true
decorations_theme_variant = "Dark"
decorations = "Buttonless"
startup_mode = "SimpleFullscreen"
# margin = 10
# padding = { x = 0, y = 0 }
# class = { instance = "alacritty", general = "Alacritty" }  # útil para reglas del WM

[scrolling]
history = 10000 # más generoso que 1000

[selection]
save_to_clipboard = true # estaba mal ubicado en [scrolling]; acá sí funciona

[terminal]
osc52 = "CopyPaste" # mantener soporte de copy/paste remoto

# Opcional: setear TERM para compatibilidad amplia
[env]
TERM = "xterm-256color"
# Si tus apps soportan bien 'alacritty', podés usar:
# TERM = "alacritty"

# --- Hints: abrir URLs con Ctrl+Shift+U y Enter ---
[hints]
alphabet = "asdfghjkl" # navegación rápida de coincidencias

[[hints.enabled]]
regex = "(https?://[\\w.-]+[\\w./?=#%&+\\-]+)"
action = "Copy"                                 # copia al portapapeles
command = { program = "xdg-open" }              # y además intenta abrir
post_processing = true
mouse.enabled = true
binding = { key = "U", mods = "Control|Shift" }

# --- Keybindings útiles ---
[keyboard]

# Copiar / pegar (Linux/Win estilo)
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

# Nueva ventana (simula “tab” a nivel WM)
[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

# Buscar (Ctrl+Shift+F abre search interno)
[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

# Zoom in/out/reset
[[keyboard.bindings]]
key = "Plus"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control|Shift"
action = "ResetFontSize"

# Desplazamiento por página
[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
action = "ScrollPageDown"

# --- Mouse ---
[mouse]
hide_when_typing = true

# --- Campana (silenciosa, sin animaciones) ---
[bell]
animation = "Disabled"
duration = 0

# --- Shell por defecto (opcional): tmux o zellij para “tabs reales” ---
# [shell]
# program = "/usr/bin/tmux"
# args = ["new-session", "-A", "-s", "main"]
#
# o:
# program = "/home/tuusuario/.cargo/bin/zellij"
