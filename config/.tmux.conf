# ==============================================================================
# Tmux Config — Solo Leveling Theme
# ==============================================================================

# -------------------------------------------------------------------
# Base
# -------------------------------------------------------------------
set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh
set-option -s escape-time 0
set-option -g mouse on
set-option -g focus-events on
set-option -g set-clipboard on

# -------------------------------------------------------------------
# Historial
# -------------------------------------------------------------------
set-option -g history-limit 10000

# -------------------------------------------------------------------
# Prefix
# -------------------------------------------------------------------
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix
bind Space send-prefix

# -------------------------------------------------------------------
# Indexación en 1
# -------------------------------------------------------------------
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# -------------------------------------------------------------------
# Colores — Solo Leveling
# -------------------------------------------------------------------
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",alacritty:Tc"

# Status bar
set-option -g status on
set-option -g status-interval 5
set-option -g status-position top

set-option -g status-style "bg=#252525 fg=#ffffff"

set-option -g status-left " #[fg=#8f45e3]#S #[fg=#ffffff]|"
set-option -g status-left-style "bg=#252525"

set-option -g status-right "#[fg=#ffffff]%H:%M #[fg=#8f45e3]%d/%m/%Y"
set-option -g status-right-style "bg=#252525"

set-window-option -g window-status-current-format " #[fg=#ffffff] #I:#W "
set-window-option -g window-status-current-style "bg=#8f45e3"
set-window-option -g window-status-format " #[fg=#fab1ed] #I:#W "
set-window-option -g window-status-style "bg=#583e53"
set-window-option -g window-status-separator ""

# Pane border
set-option -g pane-border-style "fg=#583e53 bg=#252525"
set-option -g pane-active-border-style "fg=#8f45e3 bg=#252525"

# Pane indicator
set-option -g display-panes-colour "#8f45e3"
set-option -g display-panes-active-colour "#f485ed"

# Message
set-option -g message-style "fg=#ffffff bg=#8f45e3"
set-option -g message-command-style "fg=#ffffff bg=#8f45e3"

# Clock mode
set-window-option -g clock-mode-colour "#8f45e3"

# -------------------------------------------------------------------
# Panes
# -------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# -------------------------------------------------------------------
# Ventanas
# -------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" { rename-window -- "%%" }
bind w choose-window
bind x kill-pane
bind q kill-window

# -------------------------------------------------------------------
# Misceláneo
# -------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Recargado"
bind -n M-Left previous-window
bind -n M-Right next-window
