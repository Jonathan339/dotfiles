# ==============================================================================
# Kitty Config — Solo Leveling Theme (Shadow Monarch Edition)
# Optimizada y corregida — 2026
# ==============================================================================

# ====== Tema Base (Opcional) ======
# Si quieres usar Gruvbox de fondo desenta esta línea,
# pero tus colores personalizados ya lo sobrescriben.
# include ~/.config/kitty/kitty-themes/themes/gruvbox_dark.conf

# ====== Fuente ======
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        12
disable_ligatures never

# ====== Colores URL ======
url_color #61afe0
url_style curly

# ====== Opacidad y Bordes ======
background_opacity         0.9
window_border_width        0
draw_minimal_borders       yes
hide_window_decorations    no

# ====== Tema Solo Leveling (Paleta de Sombras y Neón) ======
foreground            #ffffff
background            #252525
cursor                #ffffff
selection_background  #170830
selection_foreground  #ffffff

color0  #130728
color1  #8f45e3
color2  #8f59aa
color3  #c47be8
color4  #8f45e3
color5  #f485ed
color6  #8f45e3
color7  #fab1ed
color8  #583e53
color9  #ac53ff
color10 #ac6bcc
color11 #e18dff
color12 #b356ff
color13 #ffa6ff
color14 #ac53ff
color15 #ffbaf9

# ====== Tamaño inicial ======
initial_window_width  145c
initial_window_height 44c

# ====== Tabs (Estilo Powerline Solo Leveling) ======
inactive_tab_background #583e53
active_tab_background   #8f45e3
inactive_tab_foreground #fab1ed
tab_bar_margin_color    black
tab_bar_style           powerline

# ====== Cursor ======
cursor_shape          beam
cursor_beam_thickness 1.8

# ====== Mouse y Rendimiento ======
mouse_hide_wait   3.0
detect_urls       yes
repaint_delay     10
input_delay       3
sync_to_monitor   yes

# ====== Shell ======
shell zsh

# ====== Campana ======
bell_command none
enable_audio_bell no

# ====== Control remoto ======
allow_remote_control yes
listen_on            unix:/tmp/kitty

# ==============================================================================
# Atajos de teclado personalizados
# ==============================================================================

# --- Ventanas (Panes) ---
map ctrl+shift+n     new_window
map ctrl+shift+q     close_window
map ctrl+shift+left  previous_window
map ctrl+shift+right next_window
map ctrl+shift+f5    load_config_file

# --- Pestañas (Tabs) ---
map ctrl+t           new_tab
map ctrl+q           close_tab
map ctrl+right       next_tab
map ctrl+tab         next_tab
map ctrl+left        previous_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+up    move_tab_forward
map ctrl+shift+down  move_tab_backward

# --- Extras Útiles ---
map ctrl+shift+enter launch --type=window
map ctrl+shift+s     launch --type=tab
map ctrl+shift+l     clear_terminal reset active
