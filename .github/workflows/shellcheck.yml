name: Shellcheck

on:
  push:
    branches: [main]
    paths:
      - "*.sh"
      - "scripts/**"
      - "config/shell/**"
      - "config/colors/palette.sh"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "*.sh"
      - "scripts/**"
      - "config/shell/**"
      - "config/colors/palette.sh"
      - ".shellcheckrc"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
