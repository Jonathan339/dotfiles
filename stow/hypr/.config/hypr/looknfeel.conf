# Look & feel - valores de Omarchy (gaps 5/10, borde 2, sin blur/sombra, dwindle)

general {
    gaps_in = 1
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 0
    shadow {
        enabled = true
    }
    blur {
        enabled = false
    }
}

group {
    col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.border_inactive = rgba(595959aa)
    groupbar {
        font_size = 12
        font_family = monospace
        indicator_height = 1
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    animation = global, 1, 10, default
    animation = windows, 1, 5, easeOutQuint
    animation = workspaces, 1, 5, easeOutQuint
    animation = fade, 1, 5, almostLinear
    animation = border, 1, 5, easeInOutCubic
}

dwindle {
    pseudotile = true
    preserve_split = true
}




misc {
    disable_autoreload = false
    disable_hyprland_guiutils_check = true
}
