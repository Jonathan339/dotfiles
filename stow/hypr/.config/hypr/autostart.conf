# Autostart - adaptado de Omarchy (autostart.lua)

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --systemd --all

# Barra (Omarchy usa quickshell, nosotros waybar)
exec-once = waybar

# Fondo de pantalla: usa el elegido con SUPER+CTRL+ESPACIO, o el primero de ~/Imágenes/wallpapers
exec-once = sh -c 'if [ -f ~/.config/hypr/wallpaper ]; then swaybg -i "$(cat ~/.config/hypr/wallpaper)" -m fill; else f=$(find ~/Imágenes/wallpapers -iname "*.jpg" | head -1); [ -n "$f" ] && swaybg -i "$f" -m fill; fi'

# Idle / lock (necesitas: sudo apt install hypridle hyprlock)
exec-once = hypridle

# Clipboard manager (necesitas: sudo apt install wl-clipboard cliphist)
exec-once = wl-paste --type text --watch cliphist store

# Notificaciones (necesitas: sudo apt install dunst)
exec-once = dunst

# Compacta workspaces: rellena los vacíos automáticamente
exec-once = hypr-compact
