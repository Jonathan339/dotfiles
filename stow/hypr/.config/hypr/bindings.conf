# Keybindings - adaptados de Omarchy a tus apps
# Terminal: kitty | Browser: google-chrome | Files: thunar | Launcher: rofi

$mainMod = SUPER

# ---- Aplicaciones (bindings/applications.lua) ----
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod SHIFT, RETURN, exec, google-chrome
bind = $mainMod SHIFT, F, exec, thunar
bind = $mainMod SHIFT, N, exec, kitty -e nvim
bind = $mainMod, SPACE, exec, rofi -show drun
bind = ALT, SPACE, exec, rofi -show drun
bind = $mainMod CTRL, SPACE, exec, hypr-wallpaper

# ---- Utilidades (bindings/utilities.lua) ----
bind = $mainMod, ESCAPE, exec, hypr-power
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, K, exec, rofi -show window
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, C, exec, cliphist wipe

# ---- Tiling (bindings/tiling.lua) ----
bind = $mainMod, W, killactive
bind = $mainMod, J, togglesplit
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, I, exec, hypr-bar-island
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, F, fullscreen, maximized
bind = $mainMod, O, togglefloating
bind = $mainMod, LEFT, workspace, e-1
bind = $mainMod, RIGHT, workspace, e+1
bind = $mainMod, UP, movefocus, u
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod SHIFT, LEFT, movetoworkspace, e-1
bind = $mainMod SHIFT, RIGHT, movetoworkspace, e+1
bind = $mainMod SHIFT, UP, movewindow, u
bind = $mainMod SHIFT, DOWN, movewindow, d

# ---- Workspaces (como Omarchy, SUPER+1..9) ----
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ---- Media (bindings/media.lua) ----
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , XF86TouchpadToggle, exec, hyprctl keyword input:touchpad:enabled toggle

# ---- Clipboard universal (bindings/clipboard.lua) ----
# SUPER+C copia (CTRL+C), SUPER+V pega (CTRL+V), SUPER+X corta (CTRL+X)
bind = $mainMod, C, sendshortcut, CONTROL, C
bind = $mainMod, V, sendshortcut, CONTROL, V
bind = $mainMod, X, sendshortcut, CONTROL, X
