# Reglas de ventana (sintaxis v3) - apps que abren flotantes y centradas

windowrule {
    name = pavucontrol-flotante
    match:class = (pavucontrol)

    float = true
    center = true
}

windowrule {
    name = blueman-flotante
    match:class = (blueman-manager)

    float = true
    center = true
}

windowrule {
    name = zenity-flotante
    match:class = (zenity)

    float = true
}

# Terminal flotante con margen superior (tamaño y posición por expresiones)
# monitor_w / monitor_h = tamaño de la pantalla, restamos 25px de margen arriba
windowrule {
    name = terminal-margen-top
    match:class = (kitty|Alacritty)

    float = true
    size = (monitor_w - 6) (monitor_h - 31)
    move = 3 25
}
